<!DOCTYPE html>
<html>
	<head>
		<title> Learn C++ </title>
		<style>
			.codebox {
			    width: 300px;
    			height: 150px; /* Fixed height */
			    overflow-y: scroll; /* Enables vertical scrolling */
    			overflow-x: hidden; /* Hides horizontal scrollbar if needed */
			    padding: 10px;
    			border: 1px solid #ccc;
    			font-family: sans-serif;
    			white-space: pre-wrap; /* Preserves line breaks and wraps text */
				background-color: white;
				color: black;
			}
		</style>
	</head>
	<body style = "background-color: navy;" topmargin = "20" text = "white">
			<h5 style = "position: fixed; left: 50%; margin-top: -10px; transform: translateX(50%);"> Level 1! </h5>
		<hr size = "5" width = "100%" style = "position: fixed; top-margin: -5px;" color = "red">
		<div id  = "counter">
			Amount of lines: 1
		</div>
		<div class = "codebox" contenteditable = "true" id = "editor">
			<p> Type here... </p>
		</div>
		<script>
			const editor = document.getElementById("editor");
			const count = document.getElementById("counter");
			editor.addEventListener('input', function() {
				const text = editor.innerText; /* Get text content */
				const lineCount = text.split('\n').length; /* Get line count */
				count.innerText = `Amount of lines: ${lineCount}` /* Display it */
			} )
		</script>
	</body>
</html>
