<!DOCTYPE html>
<html>
	<head>
		<title> Learn C++ </title>
		<style>
			.codebox {
			    width: 400px;
    			height: 200px; /* Fixed height */
			    overflow-y: auto; /* Enables vertical scrolling */
    			overflow-x: hidden; /* Hides horizontal scrollbar if needed */
			    padding: 2px;
    			border: 1px solid #ccc;
    			font-family: sans-serif;
    			white-space: pre-wrap; /* Preserves line breaks and wraps text */
				background-color: black;
				color: white; /* change text color */
			}
		#counter {
			width: fit-content;
			margin-left: auto;
		}
		.horizontalparent {
			display: flex;
			align-items: center;
		}
		</style>
	</head>
	<body style = "background-color: navy;" topmargin = "50" text = "white">
		<div style = "top: 2px; position: fixed; left: 50%; transform: translateX(-50%); margin-top: -15px; width: 100vw;">
			<h5 align = "center"> Level 1! </h5>
			<hr size = "5" width = "100%" style = "position: fixed; margin-top: -10px;" color = "red">
		</div>
		<div class = "horizontalparent">
			<div style = "margin-right: auto;">
				<p align = "left"> Try writing this code, it should provide with a "Hello world" message: <br>
					<font color = "red"> <b>
						#include &gt;iostream&gt; <br>
						using namespace std; <br>
						int main() { <br>
						&nbsp;&nbsp;&nbsp;&nbsp;	cout << "Hello world"; <br>
						&nbsp;&nbsp;&nbsp;&nbsp;	return 0; <br>
						} <br>
					</b> </font>
				</p>
			</div>
			<div style = "margin-left: auto;">
				<div id  = "counter">
					Amount of lines: 1
				</div>
				<div class = "codebox" contenteditable = "true" id = "editor"> <p> //Write your code here </p> </div>
			</div>
		</div>
		<div class = "horizontalparent">
		<button type = "button" id = "button1" style = "margin-right: auto;"> Check code </button>
		<h1 id = "error" style = "margin: 0 auto;"></h1>
		</div>
		<script>
			const editor = document.getElementById("editor");
			const count = document.getElementById("counter");
			const button1 = document.getElementById("button1");
			const error = document.getElementById("error");
			editor.addEventListener('input', function() {
				const text = editor.innerText; /* Get text content */
				const lineCount = text.split('\n').length; /* Get line count */
				count.innerText = `Amount of lines: ${lineCount}` /* Display it */
			} )
			button1.addEventListener('click', function() {
    const allCode = editor.innerText.trimEnd();
    const lines = allCode.split('\n');

    let correct = true;

    for (let i = 0; i < lines.length; i++) {
        switch (i) {
            case 0:
                if (lines[i] !== "#include <iostream>") correct = false;
                break;
            case 1:
                if (lines[i] !== "using namespace std;") correct = false;
                break;
            case 2:
                if (lines[i] !== "int main() {") correct = false;
                break;
            case 3:
                if (lines[i].trim() !== 'cout << "Hello world";') correct = false;
                break;
            case 4:
                if (lines[i].trim() !== "return 0;") correct = false;
                break;
            case 5:
                if (lines[i] !== "}") correct = false;
                break;
        }
    }

    if (correct && lines.length === 6) {
        error.style.color = "green";
        error.textContent = "Good job! You did it right!";
    } else {
        error.style.color = "red";
        error.textContent = "Something went wrong. Try revising your code";
    }
});
		</script>
	</body>
</html>
