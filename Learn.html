<!DOCTYPE html>
<html>
	<head>
		<title> Learn C++ </title>
		<style>
			.codebox {
			    width: 400px;
    			height: 200px; /* Fixed height */
			    overflow-y: auto; /* Enables vertical scrolling */
    			overflow-x: hidden; /* Hides horizontal scrollbar if needed */
			    padding: 2px;
    			border: 1px solid #ccc;
    			font-family: sans-serif;
    			white-space: pre-wrap; /* Preserves line breaks and wraps text */
				background-color: black;
				color: white; /* change text color */
				margin-left: auto;
			}
		#counter {
			width: fit-content;
			margin-left: auto;
		}
		</style>
	</head>
	<body style = "background-color: navy;" topmargin = "50" text = "white">
		<div style = "top: 2px; position: fixed; left: 50%; transform: translateX(-50%); margin-top: 0px;">
			<h5 style = "position: fixed; left: 50%; margin-top: -10px; transform: translateX(50%);"> Level 1! </h5>
			<hr size = "5" width = "100%" style = "position: fixed; top-margin: -5px;" color = "red">
		</div>
		<p align = "left"> Try writing this code, it should provide with a "Hello world" message: </p>
		<div id  = "counter">
			Amount of lines: 1
		</div>
		<div class = "codebox" contenteditable = "true" id = "editor"> <p> //Write your code here </p> </div>
		<button type = "button" id = "button1"> Check code </button>
		<script>
			const editor = document.getElementById("editor");
			const count = document.getElementById("counter");
			editor.addEventListener('input', function() {
				const text = editor.innerText; /* Get text content */
				const lineCount = text.split('\n').length; /* Get line count */
				count.innerText = `Amount of lines: ${lineCount}` /* Display it */
			} )
		</script>
	</body>
</html>
