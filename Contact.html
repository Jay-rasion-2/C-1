<!DOCTYPE html>
<html>
	<head>
		<title> Contact us </title>
	</head>
	<body style = "background-color: navy; color: white;" topmargin = "50" vlink = "red" link = "green" alink = "yellow">
		<div style = "top: 2px; position: fixed; left: 50%; transform: translateX(-50%); margin-top: -10px;">
			<h3> <font face = "Franklin Gothic Demi Cond" size = "5"> <a href = "./index.html">Home</a> |
				<a href = "./Contact.html" target = "_blank">Contact</a> |
			<a href = "./Schedule.html" target = "_blank">Schedule a lesson</a> |
			<a href = "./Learn.html" target = "_blank">Online Learning</a> | <a href = "./About.html" target = "_blank">About us</a> </font> </h3>
		</div>
		<hr size = "5" color = "grey" width = "100%" style = "margin-top: -5px">
		<h1 align = "center"> Contact Us! </h1>
		<br>
		<div style = "display: flex; margin-top: 0; justify-content: center;">
			<div style = "position: relative; display: flex; flex-direction: column; border: 7px solid red; padding: 10px;">
				<h2> By Email </h2>
				<form>
					<h4> Email Address: </h4>
					<input type = "email" minlength = "12" size = "30" name = "email" required>
					<h3> Message: </h3>
					<textarea rows = "4" cols = "30" name = "comment" required> Add your message </textarea>
					<br>
					<br>
					<input type = "Submit" name = "Submit">
				</form>
			</div>
			<div style = "position: relative; display: flex; flex-direction: column; border: 7px solid red; padding: 10px;">
				<h2> By telephone </h2>
				<form>
					<h3> SMS number: </h3>
					<input type = "tel" pattern = "07\d{8}" name = "telephone number" value = "e.g. 07 9673 2854" size = "10" required>
					<br>
					<br>
					<input type = "Submit" name = "Submit">
				</form>
			</div>
		</div>
	</body>
</html>
