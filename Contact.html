<!DOCTYPE html>
<html>
	<head>
		<title> Contact us </title>
	</head>
	<body style = "background-color: navy; color: white;" topmargin = "0">
		<div style = "top: 2px; position: fixed; left: 40%; transform: translateX(-40%);">
			<h1> <font face = "Franklin Gothic Demi Cond"> <a href = "./index.html">Home</a> |
				<a href = "./Contact.html" target = "_blank">Contact</a> |
			<a href = "./Schedule.html" target = "_blank">Schedule a lesson</a> |
			<a href = "./Learn.html" target = "_blank">Online Learning</a> | <a href = "./About.html" target = "_blank">About us</a> </font> </h1>
		</div>
			About us </font> </h1>
		<br>
		<br>
		<br>
		<div align = "center" style = "display: flex-column" style = "left: 30%;">
			<h1> Contact Us! </h1>
			<h2> By Email </h2>
			<form>
				<h4> Email Address: </h4>
				<input type = "email" minlength = "12" size = "30" name = "email" required>
				<h3> Message: </h3>
				<textarea rows = "3" cols = "15" name = "comment" required> Add your message </textarea>
				<br>
				<input type = "Submit" name = "Submit">
			</form>
		</div>
		<div align = "center" style = "display: flex-column" style = "left: 70%;">
			<h2> By telephone </h2>
			<form>
				<h3> SMS number: </h3>
				<input type = "tel" pattern = "07\d{8}" name = "telephone number" value = "e.g. 07 9673 2854" required>
				<br>
				<input type = "Submit" name = "Submit">
			</form>
		</div>
	</body>
</html>
