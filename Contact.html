<!DOCTYPE html>
<html>
	<head>
		<title> Contact us </title>
	</head>
	<body style = "background-color: #1b1e1e; color: white;" topmargin = "50" vlink = "#551A8B" link = "#0056B3" alink = "#D93025">
		<div style = "top: 2px; position: fixed; left: 50%; transform: translateX(-50%); margin-top: -10px;">
			<h3> <font face = "Franklin Gothic Demi Cond" size = "5"> <a href = "./index.html">Home</a> |
				<a href = "./Contact.html">Contact</a> |
			<a href = "./Schedule.html">Schedule a lesson</a> |
			<a href = "./Learn.html" target = "_blank">Online Learning</a> | <a href = "./About.html">About us</a> </font> </h3>
		</div>
		<hr size = "5" color = "grey" width = "100%" style = "margin-top: -5px">
		<h1 align = "center"> Contact Us! </h1>
		<br>
		<div style = "display: flex; margin-top: 0; justify-content: center; gap: 20px;">
			<div style = "position: relative; display: flex; flex-direction: column; border: 7px solid #0B0E14; padding: 10px; background-color: #151B26;">
				<h2> <font color = "#19DAE6"> By Email </font> </h2>
				<form>
					<h4> <font color = "#14AEB8"> Email Address: </font> </h4>
					<input type = "email" minlength = "12" size = "30" name = "email" required>
					<h3> <font color = "#14AEB8"> Message: </font> </h3>
					<textarea rows = "4" cols = "30" name = "comment" required> Add your message </textarea>
					<br>
					<br>
					<input type = "Submit" name = "Submit">
				</form>
			</div>
			<div style = "position: relative; display: flex; flex-direction: column; border: 7px solid #0B0E14; padding: 10px; background-color: #151B26;">
				<h2> <font color = "#19DAE6"> By telephone </font> </h2>
				<form>
					<h3>  <font color = "#14AEB8"> SMS number: </font> </h3>
					<input type = "tel" pattern = "07\d{8}" name = "telephone number" value = "e.g. 07 9673 2854" size = "30" required>
					<br>
					<br>
					<input type = "Submit" name = "Submit">
				</form>
			</div>
		</div>
	</body>
</html>
