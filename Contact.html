<!DOCTYPE html>
<html>
	<head>
		<title> Contact us </title>
	</head>
	<body style = "background-color: navy; color: white;" topmargin = "0" vlink = "red" link = "green" alink = "yellow">
		<div style = "top: 2px; position: fixed; left: 40%; transform: translateX(-40%);">
			<h1> <font face = "Franklin Gothic Demi Cond"> <a href = "./index.html">Home</a> |
				<a href = "./Contact.html" target = "_blank">Contact</a> |
			<a href = "./Schedule.html" target = "_blank">Schedule a lesson</a> |
			<a href = "./Learn.html" target = "_blank">Online Learning</a> | <a href = "./About.html" target = "_blank">About us</a> </font> </h1>
		</div>
		<br>
		<br>
		<br>
		<hr size = "5" color = "grey" width = "100%">
		<div style = "display: flex; flex-direction: column; margin-top: 0; justify-content: center;">
			<div style = "position: relative; left: 30%; display: flex; flex-direction: column;">
				<h1> Contact Us! </h1>
				<h2> By Email </h2>
				<form>
					<h4> Email Address: </h4>
					<input type = "email" minlength = "12" size = "30" name = "email" required>
					<h3> Message: </h3>
					<textarea rows = "4" cols = "30" name = "comment" required> Add your message </textarea>
					<br>
					<br>
					<input type = "Submit" name = "Submit">
				</form>
			</div>
			<div style = "position: relative; left: 70%; display: flex; flex-direction: column;">
				<h2> By telephone </h2>
				<form>
					<h3> SMS number: </h3>
					<input type = "tel" pattern = "07\d{8}" name = "telephone number" value = "e.g. 07 9673 2854" size = "10" required>
					<br>
					<br>
					<input type = "Submit" name = "Submit">
				</form>
			</div>
		</div>
	</body>
</html>
