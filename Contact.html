		<h1> Contact Us! </h1>
		<h2> By Email </h2>
		<form>
			<h4> Email Address: </h4>
			<input type = "email" minlength = "12" size = "30" name = "email" required>
			<h4> Message: </h4>
			<textarea rows = "3" cols = "15" name = "comment" required> Add your message </textarea>
			<input type = "Submit" name = "Submit">
		</form>
		<h2> By telephone </h2>
		<form>
			<h4> SMS number: </h4>
			<input type = "tel" pattern = "07\d{8}" name = "telephone number" required>
			<input type = "Submit" name = "Submit">
		</form>
	</body>
</html>
